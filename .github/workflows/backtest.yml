name: Run Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        default: 'backtest'
        type: choice
        options:
          - tests
          - backtest
          - check-coverage
          - find-league
          - raw-debug

      league_name:
        description: 'League name (for backtest or find-league)'
        required: false
        default: 'Premier League'

      league_id:
        description: 'League ID (for check-coverage or raw-debug)'
        required: false
        default: '39'

      season:
        description: 'Season year, e.g. 2025 (for backtest or raw-debug)'
        required: false
        default: '2025'

      sample:
        description: 'Number of matches to sample (for backtest)'
        required: false
        default: '20'

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt pytest

      - name: Run tests
        if: github.event.inputs.mode == 'tests'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q

      - name: Run backtest
        if: github.event.inputs.mode == 'backtest'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          INPUT_LEAGUE_NAME: ${{ github.event.inputs.league_name }}
          INPUT_SEASON: ${{ github.event.inputs.season }}
          INPUT_SAMPLE: ${{ github.event.inputs.sample }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_SEASON" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: Invalid season value '$INPUT_SEASON'."
            exit 1
          fi
          if ! [[ "$INPUT_SAMPLE" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: Invalid sample value '$INPUT_SAMPLE'."
            exit 1
          fi
          python3 main.py --backtest --league-name "$INPUT_LEAGUE_NAME" --season "$INPUT_SEASON" --sample "$INPUT_SAMPLE"

      - name: Check coverage
        if: github.event.inputs.mode == 'check-coverage'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          INPUT_LEAGUE_ID: ${{ github.event.inputs.league_id }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_LEAGUE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: Invalid league_id value '$INPUT_LEAGUE_ID'."
            exit 1
          fi
          python3 main.py --check-coverage "$INPUT_LEAGUE_ID"

      - name: Find league
        if: github.event.inputs.mode == 'find-league'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          INPUT_LEAGUE_NAME: ${{ github.event.inputs.league_name }}
        run: |
          set -euo pipefail
          python3 main.py --find-league "$INPUT_LEAGUE_NAME"

      - name: Raw debug
        if: github.event.inputs.mode == 'raw-debug'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          INPUT_LEAGUE_ID: ${{ github.event.inputs.league_id }}
          INPUT_SEASON: ${{ github.event.inputs.season }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_LEAGUE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: Invalid league_id value '$INPUT_LEAGUE_ID'."
            exit 1
          fi
          if ! [[ "$INPUT_SEASON" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: Invalid season value '$INPUT_SEASON'."
            exit 1
          fi
          python3 main.py --raw-debug --league "$INPUT_LEAGUE_ID" --season "$INPUT_SEASON"
