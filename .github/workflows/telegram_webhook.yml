# Telegram transport is owned by the Val Town webhook.
# This workflow only processes one message at a time.

name: Telegram webhook

on:
  workflow_dispatch:
    inputs:
      message:
        description: Message received from Telegram
        required: true
        type: string

concurrency:
  group: telegram-webhook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate external API credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail

          missing=""

          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && missing="$missing TELEGRAM_CHAT_ID"
          [ -z "$API_FOOTBALL_KEY" ] && missing="$missing API_FOOTBALL_KEY"

          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi

          echo "Required credentials are present."

          echo "Checking Telegram token..."

          telegram_response="$(
            curl -sS \
              --fail-with-body \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe"
          )"

          if ! echo "$telegram_response" | jq -e '.ok == true' >/dev/null; then
            echo "::error::Telegram token validation failed."
            echo "$telegram_response" | jq '{ok,error_code,description}' || true
            exit 1
          fi

          echo "Telegram token is valid."

          echo "Checking API-Football token..."

          football_response="$(
            curl -sS \
              -H "x-apisports-key: ${API_FOOTBALL_KEY}" \
              "https://v3.football.api-sports.io/status"
          )"

          if ! echo "$football_response" | jq -e '.response.account' >/dev/null; then
            echo "::error::API-Football credential/status validation failed."
            echo "$football_response" | jq '{get,errors,response}' || true
            exit 1
          fi

          echo "API-Football credential is accepted."

      - name: Process Telegram message
        env:
          TELEGRAM_MESSAGE: ${{ inputs.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 telegram_bot.py

      - name: Save bot state
        if: always()
        run: |
          set -euo pipefail

          git config user.name "football-agent-bot"
          git config user.email "actions@github.com"

          # Persist conversation memory and prediction history
          # between GitHub Actions runs.
          git add telegram_memory.json predictions.db 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No persistent state changes to commit."
          else
            git commit -m "Persist bot state"
            git push
          fi

      - name: Report worker failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram failure report skipped because credentials are unavailable."
            exit 0
          fi

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg c "$TELEGRAM_CHAT_ID" \
              --arg t "⚠️ The football-agent worker crashed. Log: $RUN_URL" \
              '{chat_id: $c, text: $t}')"
