# Telegram transport is owned by the Val Town webhook.
# This workflow processes exactly one Telegram message per run.
#
# IMPORTANT:
# This workflow shares repository-state concurrency with the daily
# prediction workflow because both can modify predictions.db.

name: Telegram webhook

on:
  workflow_dispatch:
    inputs:
      message:
        description: Message received from Telegram
        required: true
        type: string

# Telegram and Daily must never write predictions.db concurrently.
concurrency:
  group: prediction-repo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -------------------------------------------------------------------
      # Repository
      # -------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------------------
      # Python
      # -------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      # -------------------------------------------------------------------
      # Credential validation
      # -------------------------------------------------------------------

      - name: Validate external API credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail

          missing=""

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            missing="$missing TELEGRAM_BOT_TOKEN"
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            missing="$missing TELEGRAM_CHAT_ID"
          fi

          if [ -z "$API_FOOTBALL_KEY" ]; then
            missing="$missing API_FOOTBALL_KEY"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi

          echo "Required credentials are present."

          # ---------------------------------------------------------------
          # Telegram
          # ---------------------------------------------------------------

          echo "Checking Telegram token..."

          telegram_response="$(
            curl -sS \
              --fail-with-body \
              --max-time 15 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe"
          )"

          if ! echo "$telegram_response" \
            | jq -e '.ok == true' >/dev/null; then

            echo "::error::Telegram token validation failed."

            echo "$telegram_response" \
              | jq '{ok,error_code,description}' || true

            exit 1
          fi

          echo "Telegram token is valid."

          # ---------------------------------------------------------------
          # API-Football
          # ---------------------------------------------------------------

          echo "Checking API-Football token..."

          football_response="$(
            curl -sS \
              --max-time 15 \
              -H "x-apisports-key: ${API_FOOTBALL_KEY}" \
              "https://v3.football.api-sports.io/status"
          )"

          if ! echo "$football_response" \
            | jq -e '.response.account' >/dev/null; then

            echo "::error::API-Football credential/status validation failed."

            echo "$football_response" \
              | jq '{get,errors,response}' || true

            exit 1
          fi

          echo "API-Football credential is accepted."

      # -------------------------------------------------------------------
      # Process exactly one Telegram message
      # -------------------------------------------------------------------

      - name: Process Telegram message
        env:
          TELEGRAM_MESSAGE: ${{ inputs.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          python3 telegram_bot.py

      # -------------------------------------------------------------------
      # Persist state
      #
      # This runs even when prediction processing fails because conversation
      # memory and any successfully written prediction state should survive.
      # -------------------------------------------------------------------

      - name: Save bot state
        if: always()
        run: |
          set -euo pipefail

          git config user.name "football-agent-bot"
          git config user.email "actions@github.com"

          # The shared concurrency group means the repository cannot be
          # modified simultaneously by the daily workflow.
          #
          # Ignore missing files because a failed/early run may not have
          # created one of them.
          git add telegram_memory.json predictions.db 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No persistent state changes to commit."
            exit 0
          fi

          git commit -m "Persist Telegram bot state"

          git push origin HEAD:${GITHUB_REF_NAME}

      # -------------------------------------------------------------------
      # Failure notification
      # -------------------------------------------------------------------

      - name: Report worker failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram failure report skipped because credentials are unavailable."
            exit 0
          fi

          curl -sS \
            --max-time 15 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg c "$TELEGRAM_CHAT_ID" \
              --arg t "⚠️ The football-agent worker failed. Log: $RUN_URL" \
              '{chat_id: $c, text: $t}')"

          echo
          echo "Failure notification attempted."
