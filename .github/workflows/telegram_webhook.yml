name: Telegram Webhook Handler

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'The message text from Telegram'
        required: true

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Process the message
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: ${{ github.event.inputs.message }}
        run: python3 telegram_bot.py

      - name: Generate dashboard
        if: always()
        run: python3 generate_dashboard.py

      - name: Save memory and dashboard
        if: always()
        run: |
          git config user.name "sports-agent-bot"
          git config user.email "actions@github.com"
          git add telegram_memory.json DASHBOARD.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Telegram webhook update"
          git push
