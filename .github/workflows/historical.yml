name: Historical Data Acquisition

on:
  workflow_dispatch:
    inputs:
      run_queue:
        description: 'Run full historical queue (all football leagues + basketball 12)'
        required: false
        type: boolean
        default: true

      sport:
        description: 'Sport (for single dataset sync)'
        required: false
        default: 'football'
        type: choice
        options:
          - football
          - basketball

      league_id:
        description: 'League ID (for single dataset sync)'
        required: false
        default: '39'

      season:
        description: 'Season year (e.g., 2024)'
        required: true
        default: '2024'

      with_enrichment:
        description: 'Fetch statistical enrichment (corners/cards)'
        required: false
        type: boolean
        default: false

      refresh:
        description: 'Force dataset re-fetch even if COMPLETE'
        required: false
        type: boolean
        default: false

jobs:
  acquire_historical:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify credentials
        run: |
          if [ -z "${{ secrets.NEON_DATABASE_URL }}" ]; then
            echo "ERROR: NEON_DATABASE_URL secret is missing."
            exit 1
          fi
          if [ -z "${{ secrets.API_FOOTBALL_KEY }}" ]; then
            echo "ERROR: API_FOOTBALL_KEY secret is missing."
            exit 1
          fi

      - name: Historical Data Sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          ENVIRONMENT: "production"
          INPUT_RUN_QUEUE: ${{ inputs.run_queue }}
          INPUT_SPORT: ${{ inputs.sport }}
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WITH_ENRICHMENT: ${{ inputs.with_enrichment }}
          INPUT_REFRESH: ${{ inputs.refresh }}
        run: |
          if [ "$INPUT_RUN_QUEUE" = "true" ]; then
            ARGS=("--historical-queue" "--season" "$INPUT_SEASON")
          else
            ARGS=("--historical-sync" "--sport" "$INPUT_SPORT" "--league" "$INPUT_LEAGUE_ID" "--season" "$INPUT_SEASON")
          fi

          if [ "$INPUT_WITH_ENRICHMENT" = "true" ]; then
            ARGS+=("--with-enrichment")
          fi
          if [ "$INPUT_REFRESH" = "true" ]; then
            ARGS+=("--refresh")
          fi
          python3 main.py "${ARGS[@]}"

      - name: Check Dataset Completion Status
        if: ${{ inputs.run_queue != true }}
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          ENVIRONMENT: "production"
          INPUT_SPORT: ${{ inputs.sport }}
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
          INPUT_SEASON: ${{ inputs.season }}
        run: |
          STATUS_OUTPUT=$(python3 main.py --dataset-status --sport "$INPUT_SPORT" --league "$INPUT_LEAGUE_ID" --season "$INPUT_SEASON")
          echo "$STATUS_OUTPUT"
          EXACT_STATUS=$(echo "$STATUS_OUTPUT" | grep -E "^[[:space:]]*Status:" | head -n 1 | awk '{print $2}')
          echo "Extracted Exact Status: '$EXACT_STATUS'"
          if [ "$EXACT_STATUS" != "COMPLETE" ]; then
            echo "ERROR: Historical dataset status is '$EXACT_STATUS', expected 'COMPLETE'."
            exit 1
          fi
