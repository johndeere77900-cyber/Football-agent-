name: Historical Data Acquisition

on:
  workflow_dispatch:
    inputs:
      run_queue:
        description: 'Run full historical queue (all football leagues + basketball 12)'
        required: false
        type: boolean
        default: true

      sport:
        description: 'Sport (for single dataset sync)'
        required: false
        default: 'football'
        type: choice
        options:
          - football
          - basketball

      league_id:
        description: 'League ID (for single dataset sync)'
        required: false
        default: '39'

      seasons:
        description: 'Season year(s), e.g. "2020", "2020 2021 2022"'
        required: false
        default: ''

      season:
        description: 'Backward-compatible single-year season option (e.g. 2024)'
        required: false
        default: ''

      with_enrichment:
        description: 'Fetch statistical enrichment (corners/cards)'
        required: false
        type: boolean
        default: false

      refresh:
        description: 'Force dataset re-fetch even if COMPLETE'
        required: false
        type: boolean
        default: false

jobs:
  acquire_historical:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse and Validate Season Parameters
        id: parse_seasons
        env:
          RAW_SEASONS_INPUT: ${{ inputs.seasons }}
          RAW_SEASON_INPUT: ${{ inputs.season }}
          RUN_QUEUE_INPUT: ${{ inputs.run_queue }}
        run: |
          set -euo pipefail
          RAW_SEASONS="$RAW_SEASONS_INPUT"
          RAW_SEASON="$RAW_SEASON_INPUT"
          RUN_QUEUE="$RUN_QUEUE_INPUT"

          if [ -n "$RAW_SEASONS" ]; then
            SELECTED_INPUT="$RAW_SEASONS"
          elif [ -n "$RAW_SEASON" ]; then
            SELECTED_INPUT="$RAW_SEASON"
          elif [ "$RUN_QUEUE" = "true" ]; then
            SELECTED_INPUT="2019 2020 2021 2022 2023 2024 2025 2026"
          else
            SELECTED_INPUT="2024"
          fi

          # Trim leading/trailing whitespace and normalize internal whitespace
          CLEAN_SEASONS=$(echo "$SELECTED_INPUT" | xargs)

          if [ -z "$CLEAN_SEASONS" ]; then
            echo "ERROR: Supplied season input is empty."
            exit 1
          fi

          VALIDATED_SEASONS=""
          for YR in $CLEAN_SEASONS; do
            if ! [[ "$YR" =~ ^[0-9]{4}$ ]]; then
              echo "ERROR: Invalid season year '$YR'. Must be a 4-digit year between 1900 and 2100."
              exit 1
            fi
            if [ "$YR" -lt 1900 ] || [ "$YR" -gt 2100 ]; then
              echo "ERROR: Season year '$YR' out of allowed range [1900, 2100]."
              exit 1
            fi
            VALIDATED_SEASONS="$VALIDATED_SEASONS $YR"
          done

          VALIDATED_SEASONS=$(echo "$VALIDATED_SEASONS" | xargs)
          FIRST_SEASON=$(echo "$VALIDATED_SEASONS" | awk '{print $1}')

          echo "seasons_arg=$VALIDATED_SEASONS" >> $GITHUB_OUTPUT
          echo "first_season=$FIRST_SEASON" >> $GITHUB_OUTPUT
          echo "Validated seasons: '$VALIDATED_SEASONS'"

      - name: Verify credentials
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "ERROR: NEON_DATABASE_URL secret is missing."
            exit 1
          fi
          if [ -n "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY secret is present."
          else
            echo "NOTICE: API_FOOTBALL_KEY secret is missing. Acquisition will rely on direct CSV / secondary fallbacks."
          fi
          if [ -n "$FOOTBALL_DATA_API_KEY" ]; then
            echo "FOOTBALL_DATA_API_KEY secret is present."
          else
            echo "NOTICE: FOOTBALL_DATA_API_KEY secret is missing. Secondary football-data.org API fallback will be unavailable."
          fi

      - name: Historical Data Sync
        id: sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          ENVIRONMENT: "production"
          INPUT_RUN_QUEUE: ${{ inputs.run_queue }}
          INPUT_SPORT: ${{ inputs.sport }}
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
          INPUT_SEASONS_ARG: ${{ steps.parse_seasons.outputs.seasons_arg }}
          INPUT_WITH_ENRICHMENT: ${{ inputs.with_enrichment }}
          INPUT_REFRESH: ${{ inputs.refresh }}
        run: |
          set +e
          if [ "$INPUT_RUN_QUEUE" = "true" ]; then
            ARGS=("--historical-queue" "--seasons")
            for YR in $INPUT_SEASONS_ARG; do
              ARGS+=("$YR")
            done
          else
            ARGS=("--historical-sync" "--sport" "$INPUT_SPORT" "--league" "$INPUT_LEAGUE_ID" "--seasons")
            for YR in $INPUT_SEASONS_ARG; do
              ARGS+=("$YR")
            done
          fi

          if [ "$INPUT_WITH_ENRICHMENT" = "true" ]; then
            ARGS+=("--with-enrichment")
          fi
          if [ "$INPUT_REFRESH" = "true" ]; then
            ARGS+=("--refresh")
          fi

          python3 main.py "${ARGS[@]}"
          SYNC_EXIT=$?
          echo "sync_exit=$SYNC_EXIT" >> $GITHUB_OUTPUT
          exit $SYNC_EXIT

      - name: Verify Persisted Historical Datasets
        if: always() && steps.sync.outcome != 'skipped'
        id: verify
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          ENVIRONMENT: "production"
          INPUT_RUN_QUEUE: ${{ inputs.run_queue }}
          INPUT_SPORT: ${{ inputs.sport }}
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
          INPUT_SEASONS_ARG: ${{ steps.parse_seasons.outputs.seasons_arg }}
        run: |
          set +e
          if [ "$INPUT_RUN_QUEUE" = "true" ]; then
            ARGS=("--verify-historical-datasets" "--historical-queue" "--seasons")
            for YR in $INPUT_SEASONS_ARG; do
              ARGS+=("$YR")
            done
          else
            ARGS=("--verify-historical-datasets" "--sport" "$INPUT_SPORT" "--league" "$INPUT_LEAGUE_ID" "--seasons")
            for YR in $INPUT_SEASONS_ARG; do
              ARGS+=("$YR")
            done
          fi

          python3 main.py "${ARGS[@]}"
          VERIFY_EXIT=$?

          SYNC_EXIT="${{ steps.sync.outputs.sync_exit }}"
          if [ -z "$SYNC_EXIT" ]; then
            echo "ERROR: Historical Data Sync did not publish sync_exit; outcome=${{ steps.sync.outcome }}"
            exit 1
          fi
          if [ "$SYNC_EXIT" != "0" ]; then
            echo "ERROR: Historical Data Sync step failed with exit code $SYNC_EXIT"
            exit "$SYNC_EXIT"
          fi
          if [ "$VERIFY_EXIT" != "0" ]; then
            echo "ERROR: Verify Persisted Historical Datasets step failed with exit code $VERIFY_EXIT"
            exit "$VERIFY_EXIT"
          fi
