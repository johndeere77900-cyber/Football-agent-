name: Historical Dataset Verification (Read-Only)

# Historical acquisition is retired. This workflow no longer acquires, rebuilds,
# repairs or backfills anything; it verifies datasets that already exist.
# Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport"
        required: true
        default: "football"
        type: choice
        options:
          - football
          - basketball
      league_id:
        description: "League ID"
        required: true
        default: "39"
      seasons:
        description: 'Season year(s), e.g. "2024" or "2023 2024"'
        required: true
        default: "2024"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify persisted historical datasets (read-only)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          ENVIRONMENT: production
          INPUT_SPORT: ${{ inputs.sport }}
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
          INPUT_SEASONS: ${{ inputs.seasons }}
        run: |
          set -euo pipefail
          read -r -a SEASON_ARGS <<< "$INPUT_SEASONS"
          python3 main.py --verify-historical-datasets \
            --sport "$INPUT_SPORT" \
            --league "$INPUT_LEAGUE_ID" \
            --seasons "${SEASON_ARGS[@]}"

      - name: Show dataset status (read-only)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
          ENVIRONMENT: production
          INPUT_SPORT: ${{ inputs.sport }}
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
          INPUT_SEASONS: ${{ inputs.seasons }}
        run: |
          set -euo pipefail
          FIRST_SEASON="${INPUT_SEASONS%% *}"
          python3 main.py --dataset-status \
            --sport "$INPUT_SPORT" \
            --league "$INPUT_LEAGUE_ID" \
            --season "$FIRST_SEASON"
