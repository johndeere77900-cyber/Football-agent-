name: Sports Predictions

on:
  schedule:
    # Runs Wednesdays and Saturdays at 11:00 UTC (12:00 PM Lagos time)
    - cron: '0 11 * * 3,6'
  workflow_dispatch:
    inputs:
      football_games:
        description: 'Number of football matches to predict (blank = skip football)'
        required: false
        default: ''
      basketball_games:
        description: 'Number of basketball games to predict (blank = skip basketball)'
        required: false
        default: ''

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Grade yesterday's football predictions
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 main.py --grade

      - name: Run football predictions
        if: github.event_name == 'schedule' || github.event.inputs.football_games != ''
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.football_games }}"
          if [ -z "$LIMIT" ]; then
            LIMIT="25"
          fi
          python3 main.py --limit "$LIMIT"

      - name: Show football accuracy report
        continue-on-error: true
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 main.py --accuracy

      - name: Grade yesterday's basketball predictions
        continue-on-error: true
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 main.py --sport basketball --grade

      - name: Run basketball predictions
        if: github.event_name == 'schedule' || github.event.inputs.basketball_games != ''
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.basketball_games }}"
          if [ -z "$LIMIT" ]; then
            LIMIT="10"
          fi
          python3 main.py --sport basketball --limit "$LIMIT"

      - name: Show basketball accuracy report
        continue-on-error: true
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 main.py --sport basketball --accuracy

      - name: Save results back to the repo
        if: always()
        run: |
          git config user.name "sports-agent-bot"
          git config user.email "actions@github.com"
          git add predictions.db
          git diff --staged --quiet || git commit -m "Prediction update $(date -u +%Y-%m-%d)"
          git push
      - name: Generate dashboard
        if: always()
        run: python3 generate_dashboard.py
