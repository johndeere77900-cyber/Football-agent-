name: PR Test Suite CI

on:
  pull_request:
    branches: [ main, "jules-*" ]
  push:
    branches: [ "jules-*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-xdist pytest-timeout

      - name: Run full test suite
        # The suite is deterministic and finishes in a few minutes; a per-test
        # bound turns any future external stall into a named failure with a
        # stack instead of silently consuming the whole job timeout.
        run: python -m pytest tests -v -n 4 --dist loadfile -p no:seleniumbase --timeout=240 --durations=10

  postgres:
    # The lifecycle date filter runs on PostgreSQL in production, so SQLite-only
    # proof is not enough. This job is a separately visible required check: it
    # provisions a pinned, disposable PostgreSQL and runs the backend-parity
    # tests. It never uses Neon or production credentials.
    name: PostgreSQL lifecycle date filter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.2-alpine
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run PostgreSQL date-filter tests
        env:
          TEST_POSTGRES_DSN: postgresql://football:football@127.0.0.1:5432/football_test
        run: |
          set -euo pipefail
          python -m pytest tests/test_postgres_kickoff_filter.py -v -p no:seleniumbase
