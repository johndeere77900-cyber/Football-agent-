name: Telegram Bot Poll

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Check Telegram and respond
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_bot.py

      - name: Save memory and offset
        if: always()
        run: |
          git config user.name "football-agent-bot"
          git config user.email "actions@github.com"
          git add telegram_offset.txt telegram_memory.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Telegram bot state update"
          git push
