name: Autonomous Match Lifecycle

# Schedules are gated on the repository variable AUTONOMOUS_SCHEDULES_ENABLED.
# They stay disabled until ChatGPT has applied the reviewed production
# migrations and the user authorises activation. Manual dispatch is always
# available for each stage.

on:
  schedule:
    - cron: "*/5 * * * *"    # live monitoring only
    - cron: "*/20 * * * *"   # discovery/pre-match and result verification/grading
    - cron: "17 3 * * *"     # controlled learning only
  workflow_dispatch:
    inputs:
      stage:
        description: "Lifecycle stage to run"
        required: true
        default: "cycle"
        type: choice
        options:
          - cycle
          - discover
          - prematch
          - live
          - verify-results
          - grade
          - learn
      horizon_days:
        description: "Rolling discovery horizon in days"
        required: false
        default: "14"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  ENVIRONMENT: production

jobs:
  live:
    name: Live monitoring
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' && vars.AUTONOMOUS_SCHEDULES_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'live' || inputs.stage == 'cycle'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: autonomous-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Poll tracked live matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
        run: |
          set -euo pipefail
          python3 main.py --autonomous live

  prematch:
    name: Discovery and pre-match snapshots
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/20 * * * *' && vars.AUTONOMOUS_SCHEDULES_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'discover' || inputs.stage == 'prematch' || inputs.stage == 'cycle'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: autonomous-prematch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Discover fixtures (rolling 14-day horizon)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
        run: |
          set -euo pipefail
          python3 main.py --autonomous discover --horizon-days "${{ inputs.horizon_days || '14' }}"
      - name: Generate pre-match predictions and snapshots
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
        run: |
          set -euo pipefail
          python3 main.py --autonomous prematch

  results:
    name: Result verification and grading
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/20 * * * *' && vars.AUTONOMOUS_SCHEDULES_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'verify-results' || inputs.stage == 'grade' || inputs.stage == 'cycle'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: autonomous-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Verify final results, grade and update historical knowledge
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
        run: |
          set -euo pipefail
          python3 main.py --autonomous verify-results

  learning:
    name: Controlled learning evaluation
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *' && vars.AUTONOMOUS_SCHEDULES_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'learn' || inputs.stage == 'cycle'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: autonomous-learning
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Evaluate and promote calibration candidates
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_NEON: "true"
        run: |
          set -euo pipefail
          python3 main.py --autonomous learn

